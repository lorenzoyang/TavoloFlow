name: ${COMPOSE_PROJECT_NAME:?Choose an isolated deployment project name}

x-api: &api
  image: tavoloflow-api:local
  build:
    context: ..
    dockerfile: deploy/Api.Dockerfile
    target: runtime
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Production
    Database__Host: db
    Database__Name: tavoloflow
    Database__Username: tavoloflow_app
    DataProtection__KeyRingPath: /var/lib/tavoloflow/keys
    AllowedHosts: ${ALLOWED_HOSTS:?Configure the public host}
    ReverseProxy__KnownProxies__0: ${PROXY_IP:-172.30.80.2}
  secrets:
    - source: app_password
      target: Database__Password
  volumes:
    - keys:/var/lib/tavoloflow/keys
  networks:
    - edge
    - database

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tavoloflow
      POSTGRES_USER: tavoloflow_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/migration_password
    secrets:
      - migration_password
      - app_password
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tavoloflow_migrator -d tavoloflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, TavoloFlow.Api.dll, --healthcheck]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  migrate:
    image: tavoloflow-migrations:local
    build:
      context: ..
      dockerfile: deploy/Api.Dockerfile
      target: migrations
    profiles: [tools]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: db
      Database__Name: tavoloflow
      Database__Username: tavoloflow_migrator
    secrets:
      - source: migration_password
        target: Database__Password
    networks: [database]
    depends_on:
      db: {condition: service_healthy}

  admin:
    <<: *api
    profiles: [tools]
    environment:
      <<: *api-env
      PlatformBootstrap__Username: ${PLATFORM_USERNAME:-platform.admin}
    secrets:
      - source: app_password
        target: Database__Password
      - source: platform_password
        target: PlatformBootstrap__Password
    command: [--seed-platform-admin]
    depends_on:
      db: {condition: service_healthy}

  web:
    image: tavoloflow-web:local
    build:
      context: ..
      dockerfile: deploy/Web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Configure the HTTPS site address}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${TLS_CONFIG:-./tls.production.conf}:/etc/caddy/tls.conf:ro
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-172.30.80.2}
    depends_on:
      api: {condition: service_healthy}

networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.80.0/28}
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.80.8/29}
  database:
    internal: true

volumes:
  postgres:
  keys:
  caddy_data:
  caddy_config:

secrets:
  migration_password:
    file: ${SECRETS_DIR:-./secrets}/migration-db-password
  app_password:
    file: ${SECRETS_DIR:-./secrets}/app-db-password
  platform_password:
    file: ${SECRETS_DIR:-./secrets}/platform-password
