name: tavoloflow-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  api:
    image: tavoloflow-api:${RELEASE_ID:?Use the release scripts or set RELEASE_ID}
    pull_policy: never
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${DOMAIN:?Set DOMAIN};localhost
      ConnectionStrings__Default: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DataProtection__KeyRingPath: /var/tavoloflow/keys
      ReverseProxy__KnownProxies__0: ${CADDY_IP:-172.30.80.2}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - protection_keys:/var/tavoloflow/keys
    networks: [proxy, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${CADDY_IP:-172.30.80.2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:2019/config/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *logging

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.80.0/24}
          # Keep automatic addresses (API and one-shot helpers) away from Caddy's static IP.
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.80.128/25}
  database:
    internal: true

volumes:
  postgres_data:
  protection_keys:
  caddy_data:
  caddy_config:
